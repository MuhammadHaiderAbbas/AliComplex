<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Booking | Ali Medical Complex, Multan</title>
  <meta name="description" content="Check the status of your appointment, cancel it, or leave a review.">
  <meta property="og:title" content="My Booking | Ali Medical Complex, Multan">
  <meta property="og:description" content="Check the status of your appointment, cancel it, or leave a review.">
  <meta name="theme-color" content="#0b6e74">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="page-head"><div class="container"><h1>My Booking</h1><p class="muted" style="margin:4px 0 0">Check your appointment, cancel it, or review your visit.</p></div></div>

<section>
  <div class="container" style="max-width:600px">
    <div id="msg"></div>
    <form id="lookup" class="card">
      <div class="field"><label for="ref">Booking reference</label><input id="ref" placeholder="AMC-XXXXXX" required style="text-transform:uppercase"></div>
      <div class="field"><label for="phone">Mobile number used for booking</label><input id="phone" placeholder="03001234567" inputmode="tel" required></div>
      <button class="btn" type="submit" style="width:100%">Find Booking</button>
      <p class="muted small" style="margin:12px 0 0">Lost your reference? Call <a data-site="phone1" href="#"></a> or <a data-site="whatsapp" href="#" target="_blank" rel="noopener">WhatsApp us</a>.</p>
    </form>
    <div id="result" class="card hidden" style="margin-top:20px"></div>
    <form id="review" class="card hidden" style="margin-top:20px">
      <h3>Rate your visit</h3>
      <p class="muted small">Your first name, rating and comment may be shown on the doctor’s profile after our staff review it.</p>
      <div class="star-input" role="radiogroup" aria-label="Rating">
        <input type="radio" name="r" id="r5" value="5"><label for="r5" title="Excellent">★</label>
        <input type="radio" name="r" id="r4" value="4"><label for="r4" title="Good">★</label>
        <input type="radio" name="r" id="r3" value="3"><label for="r3" title="Average">★</label>
        <input type="radio" name="r" id="r2" value="2"><label for="r2" title="Poor">★</label>
        <input type="radio" name="r" id="r1" value="1"><label for="r1" title="Very poor">★</label>
      </div>
      <div class="field" style="margin-top:12px"><label for="comment">Your experience (optional)</label><textarea id="comment" rows="3" maxlength="1000" placeholder="How was the doctor, staff and waiting time?"></textarea></div>
      <button class="btn" type="submit">Submit Review</button>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const showMsg = (t, type = 'error') => { $('msg').innerHTML = t ? `<div class="alert ${type}">${esc(t)}</div>` : ''; };

async function find() {
  showMsg('');
  try {
    const a = await rpc('amc_lookup', { p_ref: $('ref').value, p_phone: $('phone').value });
    storeSet('amc_last_booking', JSON.stringify({ ref: a.ref, phone: $('phone').value.replace(/[\s-]/g, '') }));
    const canCancel = ['pending', 'confirmed'].includes(a.status);
    $('result').innerHTML = `<h3>Booking ${esc(a.ref)} <span class="badge ${a.status}">${esc(a.status)}</span></h3>
      <div class="summary">
        <div><span class="muted">Patient</span><b>${esc(a.patient_name)}</b></div>
        <div><span class="muted">Doctor</span><span><a href="doctor.html?id=${a.doctor_id}">${esc(a.doctor)}</a> (${esc(a.specialty)})</span></div>
        <div><span class="muted">Date &amp; time</span><b>${fmtDate(a.date)}, ${fmtTime(a.time)}</b></div>
        <div><span class="muted">Fee (pay at clinic)</span><span>Rs. ${a.fee.toLocaleString()}</span></div>
      </div>
      ${a.status === "completed" && a.reviewed ? "<p class=\"muted\">✓ You have reviewed this visit. Thank you!</p>" : ""}
      ${a.status === 'pending' ? '<p class="muted small">Your slot is reserved. Staff may call you to confirm.</p>' : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${canCancel ? '<button class="btn danger" id="cancel">Cancel Appointment</button>' : ''}
        <a class="btn outline" href="book.html?doctor=${a.doctor_id}">Book again</a>
      </div>`;
    $('result').classList.remove('hidden');
    $('review').classList.toggle('hidden', !(a.status === 'completed' && !a.reviewed));
    if (canCancel) $('cancel').onclick = cancel;
  } catch (e) { $('result').classList.add('hidden'); $('review').classList.add('hidden'); showMsg(e.message); }
}
async function cancel() {
  if (!confirm('Cancel this appointment?')) return;
  try {
    await rpc('amc_cancel', { p_ref: $('ref').value, p_phone: $('phone').value });
    await find();
    showMsg('Your appointment has been cancelled.', 'success');
  } catch (e) { showMsg(e.message); }
}
$('lookup').addEventListener('submit', e => { e.preventDefault(); find(); });
$('review').addEventListener('submit', async e => {
  e.preventDefault();
  const r = document.querySelector('input[name=r]:checked');
  if (!r) return showMsg('Please choose a star rating.');
  try {
    await rpc('amc_submit_review', { p_ref: $('ref').value, p_phone: $('phone').value, p_rating: Number(r.value), p_comment: $('comment').value });
    $('review').classList.add('hidden'); await find();
    showMsg('Thank you! Your review has been submitted and will appear after staff approval.', 'success');
  } catch (err) { showMsg(err.message); }
});
const p = new URLSearchParams(location.search);
let last = null; try { last = JSON.parse(storeGet('amc_last_booking') || 'null'); } catch {}
const ref = p.get('ref') || last?.ref, ph = p.get('phone') || last?.phone;
if (ref && ph) { $('ref').value = ref; $('phone').value = ph; find(); }
</script>
</body>
</html>
