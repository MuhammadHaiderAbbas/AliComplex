<body>
<div id="site-header"></div>
<main id="main">
<div class="page-head"><div class="container"><h1>Hospital Letterhead</h1><p class="muted" style="margin:4px 0 0">Print on A4, or save as PDF (choose “Save as PDF” in the print window).</p></div></div>

<section>
  <div class="container">
    <p class="center no-print"><button class="btn" id="print">🖨️ Print / Save as PDF</button></p>
    <div class="doc-scroll" id="preview"></div>
  </div>
</section>
<div id="print-area"></div>
</main>
<div id="site-footer"></div>
<script src="common.js"></script>
<script src="docs.js"></script>
<script>
function draw() {
  const html = letterheadHTML('<div style="min-height:200mm"></div>');
  document.getElementById('preview').innerHTML = html;
  document.getElementById('print-area').innerHTML = html;
}
draw(); loadSite().then(draw);
document.getElementById('print').onclick = () => { document.body.classList.add('print-doc'); window.print(); document.body.classList.remove('print-doc'); };
</script>
</body>
