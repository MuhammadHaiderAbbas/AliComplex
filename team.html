<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Team | Ali Medical Complex, Multan</title>
  <meta name="description" content="Organisation chart and team of Ali Medical Complex, Multan: management, specialists, allied health, nursing and support staff.">
  <meta property="og:title" content="Our Team | Ali Medical Complex, Multan">
  <meta property="og:description" content="Organisation chart and team of Ali Medical Complex, Multan: management, specialists, allied health, nursing and support staff.">
  <meta property="og:image" content="https://muhammadhaiderabbas.github.io/AliComplex/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0b6e74">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<div class="page-head"><div class="container"><h1>Our Team</h1><p class="muted" style="margin:4px 0 0">The people who run Ali Medical Complex and care for our patients.</p></div></div>

<section>
  <div class="container">
    <div class="grid cols-4" id="team-stats" style="margin-bottom:30px"></div>
    <div class="oc-legend" id="legend"></div>
    <div id="chart"><p class="muted center">Loading…</p></div>
  </div>
</section>
<div class="cta"><div class="container">
  <div><h2>Want to see one of our specialists?</h2><p style="margin:6px 0 0;opacity:.9">See timings, fees and book online.</p></div>
  <a class="btn light" href="doctors.html">View Doctors</a>
</div></div>
</main>
<div id="site-footer"></div>
<script src="common.js"></script>
<script src="docs.js"></script>
<script>
document.getElementById('legend').innerHTML = Object.entries(GRP_LABEL).filter(([k, v]) => v)
  .map(([k, v]) => `<span><i style="background:${{ leadership: '#2a78d6', clinical: '#eb6834', allied: '#1baf7a', nursing: '#eda100', admin: '#e87ba4', support: '#008300' }[k]}"></i>${v}</span>`).join('');
rpc('amc_team').then(list => {
  document.getElementById('chart').innerHTML = orgChartHTML(list, { avatars: true });
  const people = list.filter(p => p.grp !== 'group'), c = g => people.filter(p => p.grp === g).length;
  document.getElementById('team-stats').innerHTML = [['users', people.length, 'Team members'], ['stethoscope', c('clinical'), 'Specialist doctors'],
    ['activity', c('allied'), 'Allied health'], ['shield', c('nursing'), 'Nursing staff']]
    .map(([i, n, l]) => `<div class="stat reveal"><div class="ico-badge">${icon(i)}</div><div class="n">${n}</div><div class="muted">${l}</div></div>`).join('');
})
  .catch(e => { document.getElementById('chart').innerHTML = `<p class="muted center">${esc(e.message)}</p>`; });
</script>
</body>
</html>
