<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Profile | Ali Medical Complex, Multan</title>
  <meta name="description" content="Doctor profile, timings, fee and patient reviews at Ali Medical Complex, Multan.">
  <meta property="og:title" content="Doctor Profile | Ali Medical Complex, Multan">
  <meta property="og:description" content="Doctor profile, timings, fee and patient reviews at Ali Medical Complex, Multan.">
  <meta property="og:image" content="https://alimedicalcomplex.health/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1257b8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=202611231046">
  <script src="i18n.js?v=202611231046"></script>
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section>
  <div class="container" id="wrap"><p class="muted">Loading…</p></div>
</section>
</main>
<div id="site-footer"></div>
<script src="common.js?v=202611231046"></script>
<script src="charts.js?v=202611231046"></script>
<script>
const id = Number(new URLSearchParams(location.search).get('id'));
const wrap = document.getElementById('wrap');
rpc('amc_doctor', { p_id: id }).then(d => {
  document.title = `${d.name} – ${d.specialty} | Ali Medical Complex, Multan`;
  const todayKey = ['sun','mon','tue','wed','thu','fri','sat'][new Date(todayPK() + 'T00:00:00').getDay()];
  const bookable = isBookable(d);
  wrap.innerHTML = `
  ${crumbsHTML([['doctors.html', 'Doctors'], [null, d.name]])}
  <div class="profile">
    <div>
      <div class="card">
        <div class="profile-hero">
          ${avatarHTML(d, 'avatar-xl')}
          <div>
            <h1>${esc(d.name)}</h1>
            <span class="tag">${esc(d.specialty)}</span> ${d.title ? `<span class="muted">· ${esc(d.title)}</span>` : ''}
            ${d.review_count ? `<div class="rating-line" style="margin-top:6px">${stars(d.rating)} <b>${d.rating}</b> <span class="muted">(${d.review_count} reviews)</span></div>` : ''}
            <div class="chips-row">
              ${d.fee ? `<span class="fact">${icon('wallet')} Rs. ${d.fee.toLocaleString()}</span>` : ''}
              ${d.experience ? `<span class="fact">${icon('star')} ${d.experience} years</span>` : ''}
              ${isBookable(d) ? `<span class="fact">${icon('clock')} ${Math.round(weeklyHours(d))} hrs / week</span>` : ''}
              ${d.slot_minutes ? `<span class="fact">${icon('calendar')} ${d.slot_minutes}-min visits</span>` : ''}
            </div>
          </div>
        </div>
        ${d.qualifications ? `<h3 style="margin-top:22px">Qualifications</h3><p>${esc(d.qualifications)}</p>` : ''}
        <h3>About</h3><p>${esc(d.bio)}</p>
        ${d.conditions ? `<h3>Conditions treated</h3><ul class="checklist cond-list">${d.conditions.split('\n').map(x => x.trim()).filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="doc-meta">
          ${d.experience ? `<span>Experience: <b>${d.experience} years</b></span>` : ''}
          ${d.fee ? `<span>Consultation fee: <b>Rs. ${d.fee.toLocaleString()}</b></span>` : ''}
        </div>
      </div>
      ${isBookable(d) && new Set(Object.values(d.schedule).map(x => x.join())).size > 1 ? `<div class="card chart-card" style="margin-top:22px"><h3>Hours available each day</h3><p class="sub">From the current clinic timetable</p><div id="day-chart"></div></div>` : ''}
      <div class="card" style="margin-top:22px">
        <h3>Patient reviews</h3>
        ${d.reviews.length ? d.reviews.map(r => `<div class="review">${stars(r.rating)} <b>${esc(r.name)}</b> <span class="muted small">· ${fmtDate(r.date)}</span>
            ${r.comment ? `<p style="margin:6px 0 0">${esc(r.comment)}</p>` : ''}</div>`).join('')
          : '<p class="muted">No reviews yet. Patients can leave a review after their visit from the <a href="my-booking.html#review">My Booking</a> page.</p>'}
      </div>
    </div>
    <aside class="sticky">
      <div class="card">
        <h3>Clinic timings</h3>
        <p class="muted small" style="margin-top:-6px">Ali Medical Complex, Suraj Miani Road</p>
        <table class="timetable">${DAY_ORDER.map(k => `<tr class="${k === todayKey ? 'today' : ''}"><td>${DAY_FULL[k]}</td>
          <td style="text-align:right">${d.schedule[k] ? fmtTime(d.schedule[k][0]) + ' – ' + fmtTime(d.schedule[k][1]) : '<span class="muted">Off</span>'}</td></tr>`).join('')}</table>
        ${d.leaves.length ? `<div class="alert info" style="margin:14px 0 0">On leave: ${d.leaves.slice(0, 6).map(x => fmtDate(x)).join(', ')}${d.leaves.length > 6 ? '…' : ''}</div>` : ''}
        ${isBookable(d) ? `<div class="next-box"><h4>Next available times</h4><div id="next-slots"><span class="sk sk-btn"></span></div></div>` : ''}
        ${isBookable(d) ? '<div style="margin-top:14px">' + provisionalNote(true) + '</div>' : ''}
        <div style="display:grid;gap:10px;margin-top:6px">
          ${bookable ? `<a class="btn" href="book.html?doctor=${d.id}">Book Appointment</a>` : ''}
          <a class="btn outline" href="${tel(HOSPITAL.phone1)}">Call ${esc(HOSPITAL.phone1)}</a>
          <button class="btn outline" id="share">Share profile</button>
        </div>
      </div>
    </aside>
  </div>`;
  const dc = document.getElementById('day-chart');
  if (dc) barChart(dc, DAY_ORDER.filter(k => d.schedule[k]).map(k => ({ label: DAY_FULL[k], value: weeklyHours({ schedule: { x: d.schedule[k] } }),
    tip: `${DAY_FULL[k]}: ${fmtTime(d.schedule[k][0])} – ${fmtTime(d.schedule[k][1])}` })), { unit: 'hours', caption: 'Hours available each day' });
  loadSite().then(() => { const p = document.querySelector('.sticky .prov'); if (p) p.outerHTML = provisionalNote(true); });
  const nx = nextAvailable(d);
  if (nx) rpc('amc_slots', { p_doctor_id: d.id, p_date: nx.date }).then(sl => {
    const free = sl.filter(x => x.available).slice(0, 6), day = nx.dayOffset === 0 ? 'Today' : nx.dayOffset === 1 ? 'Tomorrow' : fmtDate(nx.date);
    document.getElementById('next-slots').innerHTML = free.length ? `<div class="muted small" style="margin-bottom:8px">${esc(day)}</div><div class="slots">${free.map(x =>
      `<a class="slot" href="book.html?doctor=${d.id}&date=${nx.date}&time=${x.time}">${fmtTime(x.time)}</a>`).join('')}</div>` : '<p class="muted small">No free times on the next clinic day. Choose another day when booking.</p>';
  }).catch(() => { document.getElementById('next-slots').innerHTML = ''; });
  document.getElementById('share').onclick = async () => {
    const data = { title: d.name, text: `${d.name} – ${d.specialty} at Ali Medical Complex, Multan`, url: location.href };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert('Link copied.'); } } catch {}
  };
}).catch(e => { wrap.innerHTML = `<div class="nf"><h2>Doctor not found</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="doctors.html">See all doctors</a></div>`; });
</script>
</body>
</html>
