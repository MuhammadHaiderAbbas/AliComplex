<body>
<div id="site-header"></div>
<main id="main">
<div class="page-head"><div class="container"><h1>Services &amp; Specialties</h1><p class="muted" style="margin:4px 0 0">What we treat, and which doctor to see.</p></div></div>

<section>
  <div class="container" id="blocks"><p class="muted">Loading…</p></div>
</section>
<section class="soft">
  <div class="container">
    <div class="section-head"><h2>Not sure which doctor to see?</h2><p class="muted">Send us a WhatsApp message or call, and our staff will guide you to the right specialist.</p></div>
    <p class="center"><a class="btn" data-site="whatsapp" href="#" target="_blank" rel="noopener">Ask on WhatsApp</a> <a class="btn outline" data-site="phone1" href="#"></a></p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="common.js?v=202611231046"></script>
<script>
function render(docs) {
  const slug = s => s.name.toLowerCase().replace(/[^a-z]+/g, '-');
  document.getElementById('blocks').innerHTML = `<div class="svc-grid">${SPECIALTIES.map(s => `<a class="svc-tile reveal" href="#${slug(s)}"><span class="ico-badge">${icon(s.icon)}</span><b>${s.name}</b><small>${docs.filter(d => s.key && d.specialty.toLowerCase().includes(s.key.toLowerCase())).length || ''}</small></a>`).join('')}</div>` + SPECIALTIES.map(s => {
    const ds = s.key ? docs.filter(d => d.specialty.toLowerCase().includes(s.key.toLowerCase())) : [];
    const id = s.name.toLowerCase().replace(/[^a-z]+/g, '-');
    return `<div class="service-block" id="${id}">
      <div class="ico">${icon(s.icon)}</div>
      <div><h2>${s.name}</h2><p class="muted">${s.short}</p>
        <h3 style="font-size:1rem;margin-top:14px">Common conditions treated</h3>
        <ul class="cond">${s.conditions.map(c => `<li>${c}</li>`).join('')}</ul>
        ${s.key ? `<p><b>Doctors:</b> ${ds.length ? ds.map(d => `<a href="doctor.html?id=${d.id}">${esc(d.name)}</a>`).join(', ') : '<span class="muted">Please call to ask about availability.</span>'}</p>` : '<p class="muted">Available at the hospital during OPD hours.</p>'}
        ${ds.length ? `<a class="btn small" href="doctors.html?specialty=${encodeURIComponent(ds[0].specialty)}">See ${esc(s.name)} doctors</a>` : ''}
      </div></div>`;
  }).join('');
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
rpc('amc_doctors').then(render).catch(() => render([]));
</script>
</body>
</html>
